name: Compilar (macOS)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # necessário para publicar na página Releases

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Definir a versão
        run: echo "VERSION=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Versões das ferramentas
        run: |
          xcodebuild -version
          swift --version

      # ---------------------------------------------------------------- Plugin
      - name: Plugin - configurar (CMake)
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Plugin - compilar
        run: cmake --build build --config Release -j "$(sysctl -n hw.ncpu)"

      # ----------------------------------------------------------------- Motor
      - name: Motor - compilar (Swift)
        working-directory: engine
        run: swift build -c release --arch arm64 --arch x86_64

      # ----------------------------------------------------------------- Pacote
      - name: Preparar a assinatura (certificado próprio do C00KUP, se existir)
        env:
          P12_BASE64: ${{ secrets.C00KUP_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.C00KUP_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${P12_BASE64}" ]; then
            echo "Sem certificado nos Secrets: assinatura ad-hoc (as permissões voltam a ser pedidas a cada versão)."
            echo "SIGN_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          KC="$RUNNER_TEMP/c00kup.keychain-db"
          KC_PASS="$(openssl rand -hex 12)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/c00kup.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/c00kup.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/c00kup.p12"
          # Certificado próprio (não é da Apple): usar pelo identificador SHA-1
          HASH=$(security find-identity -p codesigning "$KC" | awk '/C00KUP 808College/ {print $2; exit}')
          if [ -z "$HASH" ]; then echo "Certificado não encontrado no keychain"; exit 1; fi
          echo "Assinatura própria: C00KUP 808College ($HASH)"
          echo "SIGN_IDENTITY=$HASH" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Assinar e preparar pacote
        run: |
          set -euo pipefail
          ART="build/plugin/C00KUP_artefacts/Release"
          PKG="dist/C00KUP"
          mkdir -p "$PKG"

          # Plugin
          cp -R "$ART/VST3/C00KUP.vst3"      "$PKG/"
          cp -R "$ART/AU/C00KUP.component"   "$PKG/"

          # Motor (.app montada à mão: executável + Info.plist)
          BIN_DIR="$(cd engine && swift build -c release --arch arm64 --arch x86_64 --show-bin-path)"
          APP="$PKG/C00KUP Engine.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "$BIN_DIR/C00KUPEngine" "$APP/Contents/MacOS/C00KUPEngine"
          iconutil -c icns engine/AppIcon.iconset -o "$APP/Contents/Resources/AppIcon.icns"
          cp engine/Info.plist "$APP/Contents/Info.plist"
          plutil -replace CFBundleShortVersionString -string "$VERSION" "$APP/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "$GITHUB_RUN_NUMBER" "$APP/Contents/Info.plist"
          plutil -lint "$APP/Contents/Info.plist"

          KC_ARGS=()
          if [ -n "${SIGN_KEYCHAIN:-}" ]; then KC_ARGS=(--keychain "$SIGN_KEYCHAIN"); fi
          for b in "$PKG/C00KUP.vst3" "$PKG/C00KUP.component" "$APP"; do
            codesign --force --deep --sign "$SIGN_IDENTITY" ${KC_ARGS[@]+"${KC_ARGS[@]}"} --timestamp=none "$b"
            codesign --verify --deep --verbose=2 "$b"
          done
          echo "Requisito de identidade do motor (o que o macOS usa para lembrar as permissões):"
          codesign -d -r- "$APP" 2>&1 | tail -1

          lipo -info "$PKG/C00KUP.vst3/Contents/MacOS/C00KUP"
          lipo -info "$APP/Contents/MacOS/C00KUPEngine"

          cp packaging/instalar.sh packaging/LEIA-ME.txt "$PKG/"
          mkdir -p "$PKG/Licencas"
          cp plugin/Assets/OFL-*.txt "$PKG/Licencas/"
          chmod +x "$PKG/instalar.sh"

          (cd dist && ditto -c -k --sequesterRsrc --keepParent "C00KUP" "C00KUP-v${VERSION}.zip")
          ls -la dist

      - name: Criar o instalador .pkg
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/pkgroot"
          rm -rf "$ROOT" && mkdir -p "$ROOT/Library/Audio/Plug-Ins/VST3" "$ROOT/Library/Audio/Plug-Ins/Components" \
                                     "$ROOT/Applications" "$ROOT/Library/Application Support/808College/C00KUP/Licencas"
          ditto "dist/C00KUP/C00KUP.vst3"        "$ROOT/Library/Audio/Plug-Ins/VST3/C00KUP.vst3"
          ditto "dist/C00KUP/C00KUP.component"   "$ROOT/Library/Audio/Plug-Ins/Components/C00KUP.component"
          ditto "dist/C00KUP/C00KUP Engine.app"  "$ROOT/Applications/C00KUP Engine.app"
          cp plugin/Assets/OFL-*.txt "$ROOT/Library/Application Support/808College/C00KUP/Licencas/"

          # Instalar sempre nos sítios certos (não "procurar" cópias antigas noutro lado)
          pkgbuild --analyze --root "$ROOT" "$RUNNER_TEMP/components.plist"
          i=0
          while /usr/libexec/PlistBuddy -c "Print :$i" "$RUNNER_TEMP/components.plist" >/dev/null 2>&1; do
            /usr/libexec/PlistBuddy -c "Delete :$i:BundleIsRelocatable" "$RUNNER_TEMP/components.plist" >/dev/null 2>&1 || true
            /usr/libexec/PlistBuddy -c "Add :$i:BundleIsRelocatable bool false" "$RUNNER_TEMP/components.plist"
            i=$((i+1))
          done

          pkgbuild --root "$ROOT" --component-plist "$RUNNER_TEMP/components.plist" \
                   --identifier com.808college.c00kup.pkg --version "$VERSION" \
                   --scripts packaging/macos/scripts --install-location / \
                   "$RUNNER_TEMP/C00KUP-component.pkg"

          sed "s/__VERSION__/$VERSION/" packaging/macos/distribution.xml > "$RUNNER_TEMP/distribution.xml"
          productbuild --distribution "$RUNNER_TEMP/distribution.xml" \
                       --resources packaging/macos/resources \
                       --package-path "$RUNNER_TEMP" \
                       "dist/C00KUP-v${VERSION}.pkg"
          pkgutil --payload-files "dist/C00KUP-v${VERSION}.pkg" | grep -E "C00KUP\.(vst3|component)$|Engine\.app$"
          ls -la dist

      - name: Testar o instalador .pkg (instala neste Mac)
        run: |
          set -euo pipefail
          sudo installer -pkg "dist/C00KUP-v${VERSION}.pkg" -target / -verboseR | tail -5
          for f in "/Library/Audio/Plug-Ins/VST3/C00KUP.vst3" "/Library/Audio/Plug-Ins/Components/C00KUP.component" \
                   "/Applications/C00KUP Engine.app/Contents/MacOS/C00KUPEngine" \
                   "/Applications/C00KUP Engine.app/Contents/Resources/AppIcon.icns"; do
            if [ -e "$f" ]; then echo "OK  $f"; else echo "FALTA  $f"; exit 1; fi
          done
          codesign --verify --deep "/Applications/C00KUP Engine.app" && echo "OK  assinatura do motor intacta"
          pkgutil --pkg-info com.808college.c00kup.pkg

      - name: Validar o Audio Unit (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "dist/C00KUP/C00KUP.component" ~/Library/Audio/Plug-Ins/Components/
          sudo rm -rf /Library/Audio/Plug-Ins/Components/C00KUP.component   # deixar só uma cópia para o auval
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -v aufx C00k Cl8g

      - name: Autoteste do motor (recorte, pré-visualização, MP4, sincronização)
        env:
          SELFTEST_OUT: ${{ github.workspace }}/amostras
        run: |
          "dist/C00KUP/C00KUP Engine.app/Contents/MacOS/C00KUPEngine" --selftest

      - name: Guardar imagens de exemplo dos efeitos
        uses: actions/upload-artifact@v4
        with:
          name: amostras-efeitos
          path: amostras/

      - name: Testar o arranque do motor
        run: |
          set -euo pipefail
          APP="dist/C00KUP/C00KUP Engine.app"
          "$APP/Contents/MacOS/C00KUPEngine" &
          PID=$!
          sleep 4
          # O motor deve estar a escutar em 127.0.0.1:48809
          if lsof -nP -iTCP:48809 -sTCP:LISTEN; then echo "Motor a escutar: OK"; else echo "Motor NÃO está a escutar"; kill $PID || true; exit 1; fi
          kill $PID || true

      - name: Guardar o instalador e o zip como artefactos da compilação
        uses: actions/upload-artifact@v4
        with:
          name: C00KUP-v${{ env.VERSION }}
          path: |
            dist/C00KUP-v${{ env.VERSION }}.pkg
            dist/C00KUP-v${{ env.VERSION }}.zip

      - name: Publicar na página Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          gh release create "$TAG" "dist/C00KUP-v${VERSION}.pkg" "dist/C00KUP-v${VERSION}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "C00KUP v${VERSION}" \
            --notes "Compilação automática do ramo \`${GITHUB_REF_NAME}\` (commit ${GITHUB_SHA::7}).

          Instalador: descarregue C00KUP-v${VERSION}.pkg e faça duplo clique. O .zip é a alternativa por Terminal (ver LEIA-ME.txt)."
